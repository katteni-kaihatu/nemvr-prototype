name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust, Elixir, and protocol
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install workspace dependencies
        run: nix develop -c bash -lc 'pnpm install --frozen-lockfile'
      - name: Install Rust toolchain
        run: nix develop -c bash -lc 'rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Fetch Elixir dependencies
        run: nix develop -c bash -lc 'cd apps/server && mix local.hex --force && mix local.rebar --force && mix deps.get'
      - name: Rust fmt, clippy, and tests
        run: nix develop -c bash -lc 'pnpm fmt:native && pnpm clippy:native && pnpm test:native'
      - name: Elixir and protocol typecheck and tests
        run: nix develop -c bash -lc 'pnpm typecheck && pnpm test'

  godot:
    name: Godot client
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install Rust toolchain
        run: nix develop -c bash -lc 'rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Fetch Elixir dependencies
        run: nix develop -c bash -lc 'cd apps/server && mix local.hex --force && mix local.rebar --force && mix deps.get'
      - name: Native bridge and presentation tests
        run: nix develop -c bash -lc 'PROTO_SKIP_GODOT_IMPORT=1 pnpm test:godot'
      - name: Two-client scene E2E
        run: nix develop -c bash -lc 'PROTO_SKIP_GODOT_IMPORT=1 pnpm e2e:godot -- --no-build'
      - name: Mixed Bevy and Godot E2E
        run: nix develop -c bash -lc 'pnpm build:native && PROTO_SKIP_GODOT_IMPORT=1 pnpm e2e:godot:mixed'

  linux-package:
    name: Linux package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install Rust toolchain
        run: nix develop -c bash -lc 'rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build AppImage
        run: nix develop -c bash -lc 'PROTO_SKIP_GODOT_IMPORT=1 pnpm package:linux'
      - uses: actions/upload-artifact@v4
        with:
          name: godot-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/ProtoSNS-godot-x86_64.AppImage
            dist/ProtoSNS-godot-x86_64.AppImage.sha256
            dist/ProtoSNS-godot-linux-x86_64.tar.gz
            dist/ProtoSNS-godot-linux-x86_64.tar.gz.sha256

  windows-package:
    name: Windows package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install Rust toolchain
        run: nix develop .#windows -c bash -lc 'rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build Godot candidate
        run: nix develop .#windows -c bash -lc 'PROTO_SKIP_GODOT_IMPORT=1 pnpm package:godot:windows && pnpm smoke:godot:windows'
      - name: Build Bevy fallback
        run: nix develop .#windows -c bash -lc 'pnpm package:windows'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/ProtoSNS-godot-windows-x86_64.zip
            dist/ProtoSNS-godot-windows-x86_64.zip.sha256
            dist/ProtoSNS-windows-x86_64.zip
            dist/ProtoSNS-windows-x86_64.zip.sha256
