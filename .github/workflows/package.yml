name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and smoke-test
        run: nix develop -c bash -lc 'pnpm package:linux'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          if-no-files-found: error
          path: |
            dist/ProtoSNS-godot-x86_64.AppImage
            dist/ProtoSNS-godot-x86_64.AppImage.sha256
            dist/ProtoSNS-godot-linux-x86_64.tar.gz
            dist/ProtoSNS-godot-linux-x86_64.tar.gz.sha256
            dist/ProtoSNS-x86_64.AppImage
            dist/ProtoSNS-x86_64.AppImage.sha256

  windows:
    name: Windows zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build Godot candidate and smoke-test under Wine
        run: nix develop .#windows -c bash -lc 'pnpm package:godot:windows && pnpm smoke:godot:windows'
      - name: Build Bevy fallback
        run: nix develop .#windows -c bash -lc 'pnpm package:windows'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          if-no-files-found: error
          path: |
            dist/ProtoSNS-godot-windows-x86_64.zip
            dist/ProtoSNS-godot-windows-x86_64.zip.sha256
            dist/ProtoSNS-windows-x86_64.zip
            dist/ProtoSNS-windows-x86_64.zip.sha256
