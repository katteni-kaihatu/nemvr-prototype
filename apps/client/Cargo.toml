[package]
name = "proto-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Bevy client for the VR SNS prototype"

[features]
default = ["ipfs"]
ipfs = ["dep:rust-ipfs"]
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr"]
vrm = ["dep:bevy_vrm"]
video = []

[dependencies]
anyhow.workspace = true
bevy.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
image.workspace = true
reqwest.workspace = true
rust-ipfs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
space-protocol = { path = "../../crates/space-protocol" }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
bevy_vrm = { version = "0.4", optional = true }
