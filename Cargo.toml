[workspace]
resolver = "2"
members = ["crates/space-protocol", "crates/client-core", "crates/godot-client", "apps/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
bevy = "0.19"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
glam = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rust-ipfs = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# parley 0.9.0 は CJK の辞書を読み込まず、日本語の行分割で
# `No segmentation model` を繰り返し出力する。`new_dictionary` を使う修正。
[patch.crates-io]
parley = { path = "vendor/parley" }
# connexa 0.5.3 の WebSocket は /dns を内側 TCP に渡すが、その TCP が DNS を
# 解決できず /tls/ws が失敗する。内側 TCP に DNS transport を組み込む。
connexa = { path = "vendor/connexa" }
